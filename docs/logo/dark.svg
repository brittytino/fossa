<svg width="130" height="36" viewBox="0 0 130 36" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="fossa-dark-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE047" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#EA580C" />
        </linearGradient>
        <filter id="fossa-gold-glow" x="-4" y="-4" width="40" height="40" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- FOSSA Shield Badge (Golden Sunburst / Orange) -->
    <g transform="translate(2, 2)">
        <rect
            x="0"
            y="0"
            width="32"
            height="32"
            rx="8"
            fill="url(#fossa-dark-gold-grad)"
        />
        <!-- Inner dynamic 'F' glyph -->
        <path
            d="M10 8.5 H22 C23.1 8.5 24 9.4 24 10.5 C24 11.6 23.1 12.5 22 12.5 H14 V14.5 H20 C21.1 14.5 22 15.4 22 16.5 C22 17.6 21.1 18.5 20 18.5 H14 V23.5 C14 24.6 13.1 25.5 12 25.5 C10.9 25.5 10 24.6 10 23.5 Z"
            fill="#FFFFFF"
        />
        <!-- Accent spark dot -->
        <circle cx="21" cy="23" r="2.2" fill="#FFFFFF" fill-opacity="0.95" />
    </g>

    <!-- Wordmark: F O S S A -->
    <text
        x="44"
        y="24"
        fill="#FFFFFF"
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20"
        font-weight="800"
        letter-spacing="0.16em">
        FOSSA
    </text>
</svg>
