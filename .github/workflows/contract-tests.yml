name: "Contract Tests: External APIs"

# Calls real external APIs (GitLab, Bitbucket, Azure REST, LLM providers) to
# confirm FOSSA''s assumptions about their shapes. Each test skips if its
# credentials are absent, so a run with no secrets reports partial coverage
# rather than a false failure.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: External API contract tests
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run contract tests
        env:
          GITLAB_TOKEN:            ${{ secrets.GITLAB_TOKEN }}
          BITBUCKET_TOKEN:         ${{ secrets.BITBUCKET_TOKEN }}
          AZURE_DEVOPS_TOKEN:      ${{ secrets.AZURE_DEVOPS_TOKEN }}
          FIREWORKS_API_KEY:       ${{ secrets.FIREWORKS_API_KEY }}
          OPENAI_API_KEY:          ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY:       ${{ secrets.GOOGLE_AI_API_KEY }}
          API_NODE_ENV:            test
        run: pnpm run test --testPathPattern="contract" --no-coverage --forceExit
