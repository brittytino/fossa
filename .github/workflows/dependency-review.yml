name: "Security: Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4.7.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
