name: "Backend: Typecheck Gate (libs)"

on:
  pull_request:
    paths:
      - "libs/**"
      - "scripts/typecheck-libs-gate.sh"
      - ".github/workflows/typecheck-gate.yml"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  libs-ts2304:
    name: No undeclared-name errors in libs/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Fail on TS2304 undeclared-name errors in libs/
        run: pnpm run typecheck:libs-gate
