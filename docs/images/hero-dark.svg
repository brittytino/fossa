<svg width="700" height="320" viewBox="0 0 700 320" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="fossa-hero-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#000000" />
            <stop offset="50%" stop-color="#050505" />
            <stop offset="100%" stop-color="#000000" />
        </linearGradient>
        <linearGradient id="fossa-hero-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE047" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#EA580C" />
        </linearGradient>
        <radialGradient id="fossa-gold-glow-1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 160) scale(260 160)">
            <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
            <stop offset="50%" stop-color="#EA580C" stop-opacity="0.10" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>
        <clipPath id="fossa-hero-gold-clip">
            <rect width="700" height="320" rx="16" />
        </clipPath>
    </defs>

    <g clip-path="url(#fossa-hero-gold-clip)">
        <!-- Pure Pitch Black Background -->
        <rect width="700" height="320" rx="16" fill="url(#fossa-hero-dark-bg)" />
        <rect width="700" height="320" fill="url(#fossa-gold-glow-1)" />

        <!-- Warm Amber Tech Grid -->
        <g opacity="0.10" stroke="#F59E0B" stroke-width="0.75" stroke-dasharray="4 6">
            <line x1="0" y1="80" x2="700" y2="80" />
            <line x1="0" y1="160" x2="700" y2="160" />
            <line x1="0" y1="240" x2="700" y2="240" />
            <line x1="175" y1="0" x2="175" y2="320" />
            <line x1="350" y1="0" x2="350" y2="320" />
            <line x1="525" y1="0" x2="525" y2="320" />
        </g>

        <!-- Concentric Warm Gold Rings -->
        <circle cx="350" cy="160" r="130" stroke="url(#fossa-hero-gold-grad)" stroke-opacity="0.22" stroke-width="1.5" />
        <circle cx="350" cy="160" r="85" stroke="#FBBF24" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="3 4" />

        <!-- FOSSA Shield Monogram -->
        <g transform="translate(322, 110) scale(1.75)">
            <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#fossa-hero-gold-grad)" />
            <path d="M10 8.5 H22 C23.1 8.5 24 9.4 24 10.5 C24 11.6 23.1 12.5 22 12.5 H14 V14.5 H20 C21.1 14.5 22 15.4 22 16.5 C22 17.6 21.1 18.5 20 18.5 H14 V23.5 C14 24.6 13.1 25.5 12 25.5 C10.9 25.5 10 24.6 10 23.5 Z" fill="#FFFFFF" />
            <circle cx="21" cy="23" r="2.2" fill="#FFFFFF" fill-opacity="0.95" />
        </g>

        <!-- Typography -->
        <text x="350" y="210" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="0.2em">FOSSA</text>
        <text x="350" y="235" text-anchor="middle" fill="#A8A29E" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="0.08em">AUTONOMOUS AI CODE REVIEW PLATFORM</text>
    </g>
</svg>
