<svg width="700" height="320" viewBox="0 0 700 320" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="fossa-hero-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#090D16" />
            <stop offset="50%" stop-color="#0F172A" />
            <stop offset="100%" stop-color="#090D16" />
        </linearGradient>
        <linearGradient id="fossa-hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="50%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#EC4899" />
        </linearGradient>
        <radialGradient id="fossa-glow-1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 160) scale(260 160)">
            <stop offset="0%" stop-color="#6366F1" stop-opacity="0.32" />
            <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
        </radialGradient>
        <filter id="fossa-blur-glow" x="150" y="-40" width="400" height="400" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="64" />
        </filter>
        <clipPath id="fossa-hero-clip">
            <rect width="700" height="320" rx="16" />
        </clipPath>
    </defs>

    <g clip-path="url(#fossa-hero-clip)">
        <!-- Background -->
        <rect width="700" height="320" rx="16" fill="url(#fossa-hero-dark-bg)" />
        <rect width="700" height="320" fill="url(#fossa-glow-1)" />

        <!-- Subtle Tech Grid -->
        <g opacity="0.12" stroke="#6366F1" stroke-width="0.75" stroke-dasharray="4 6">
            <line x1="0" y1="80" x2="700" y2="80" />
            <line x1="0" y1="160" x2="700" y2="160" />
            <line x1="0" y1="240" x2="700" y2="240" />
            <line x1="175" y1="0" x2="175" y2="320" />
            <line x1="350" y1="0" x2="350" y2="320" />
            <line x1="525" y1="0" x2="525" y2="320" />
        </g>

        <!-- Centered Glowing Emblems & Rings -->
        <circle cx="350" cy="160" r="130" stroke="url(#fossa-hero-grad)" stroke-opacity="0.25" stroke-width="1.5" />
        <circle cx="350" cy="160" r="85" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 4" />

        <!-- FOSSA Shield Monogram -->
        <g transform="translate(322, 110) scale(1.75)">
            <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#fossa-hero-grad)" />
            <path d="M10 8.5 H22 C23.1 8.5 24 9.4 24 10.5 C24 11.6 23.1 12.5 22 12.5 H14 V14.5 H20 C21.1 14.5 22 15.4 22 16.5 C22 17.6 21.1 18.5 20 18.5 H14 V23.5 C14 24.6 13.1 25.5 12 25.5 C10.9 25.5 10 24.6 10 23.5 Z" fill="#FFFFFF" />
            <circle cx="21" cy="23" r="2.2" fill="#FFFFFF" fill-opacity="0.95" />
        </g>

        <!-- Typography -->
        <text x="350" y="210" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="0.2em">FOSSA</text>
        <text x="350" y="235" text-anchor="middle" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="0.08em">AI CODE REVIEW &amp; HARNESS PLATFORM</text>
    </g>
</svg>
