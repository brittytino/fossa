name: "Backend: Permissions Matrix Check"

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "libs/identity/domain/permissions/policies/role-policies.ts"
      - "libs/identity/domain/permissions/enums/permissions.enum.ts"
      - "scripts/permissions/**"
      - ".github/workflows/permissions-matrix-check.yml"

jobs:
  matrix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Verify RBAC matrix is in sync with ROLE_POLICIES
        run: pnpm run permissions:matrix:check
