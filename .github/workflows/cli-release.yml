name: "CLI: Release"

# Trigger on tags like cli-v0.4.15 or via manual workflow_dispatch.
# Also callable from other workflows via workflow_call.
on:
  push:
    tags:
      - 'cli-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "CLI tag to publish (e.g. cli-v0.4.21)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: "CLI tag to publish (e.g. cli-v0.4.21)."
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: apps/cli
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/cli/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Verify tools
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate skills
        run: |
          pnpm skills:validate
          pnpm skills:prompt > /dev/null

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            npm publish --access public
          else
            echo "::warning::NPM_TOKEN secret not set. Skipping npm publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get previous release date
        id: prev
        working-directory: ${{ github.workspace }}
        run: |
          prev=$(gh release list -R ${{ github.repository }} --limit 50 \
            --json tagName,publishedAt -q '[.[] | select(.tagName | startswith("cli-v"))][1].publishedAt // empty')
          echo "date=${prev:-$(date -d '-30 days' -Idate)}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog & Update Release Notes
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ secrets.CHANGELOG_API_URL }}" ]; then
            end_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            response=$(curl -sf -X POST "${{ secrets.CHANGELOG_API_URL }}/api/v1/changelog" \
              -H "Content-Type: application/json" \
              -d '{
                "owner": "${{ github.repository_owner }}",
                "repo": "${{ github.event.repository.name }}",
                "startDate": "${{ steps.prev.outputs.date }}",
                "endDate": "'"$end_date"'",
                "style": "end-user",
                "webhookUrl": "${{ secrets.WEBHOOK_URL }}"
              }' || true)
            if [ -n "$response" ]; then
              echo "$response" | jq -r '.changelog // empty' > changelog.md
              if [ -s changelog.md ]; then
                gh release edit "$RELEASE_TAG" -R ${{ github.repository }} --notes-file changelog.md
              fi
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
