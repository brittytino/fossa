# ==============================================================================
# Docker Compose for Self-Hosted Production Environment
# ==============================================================================
# This file is intended for users who want to run the application on their own
# infrastructure. It supports both using pre-built images from GitHub Container
# Registry (GHCR) and building directly from source.
#
# Usage:
# 1. Create a `.env.prod` file by copying `.env.example`:
#    cp .env.example .env.prod
# 2. Fill in the required environment variables in `.env.prod`.
# 3. Run:
#    ENV_FILE=.env.prod docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:
    #----------------------------------------------------------------
    # Application Services
    #----------------------------------------------------------------
    api:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: api
        image: ghcr.io/brittytino/fossa-api:${FOSSA_VERSION:-latest}
        container_name: fossa_api_prod
        restart: unless-stopped
        command: node dist/apps/api/main.js
        env_file:
            - path: ${ENV_FILE:-.env.prod}
              required: false
            - path: .env
              required: false
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=api
        ports:
            - '${API_PORT:-3001}:3001'
        depends_on:
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            fossa-backend-services:
                aliases:
                    - fossa_api
                    - api

    worker:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: worker
        image: ghcr.io/brittytino/fossa-worker:${FOSSA_VERSION:-latest}
        container_name: fossa_worker_prod
        restart: unless-stopped
        command: node dist/apps/worker/main.js
        env_file:
            - path: ${ENV_FILE:-.env.prod}
              required: false
            - path: .env
              required: false
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=worker
            - WORKER_ROLE=code-review
        depends_on:
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - fossa-backend-services

    worker-analytics:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: worker
        image: ghcr.io/brittytino/fossa-worker:${FOSSA_VERSION:-latest}
        container_name: fossa_analytics_worker_prod
        restart: unless-stopped
        command: node dist/apps/worker/main.js
        env_file:
            - path: ${ENV_FILE:-.env.prod}
              required: false
            - path: .env
              required: false
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=worker
            - WORKER_ROLE=analytics
        depends_on:
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - fossa-backend-services

    webhooks:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: webhooks
        image: ghcr.io/brittytino/fossa-webhook:${FOSSA_VERSION:-latest}
        container_name: fossa_webhooks_prod
        restart: unless-stopped
        command: node dist/apps/webhooks/main.js
        env_file:
            - path: ${ENV_FILE:-.env.prod}
              required: false
            - path: .env
              required: false
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=webhook
        ports:
            - '${API_WEBHOOKS_PORT:-3332}:3332'
        depends_on:
            db_postgres:
                condition: service_healthy
            db_mongodb:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            fossa-backend-services:
                aliases:
                    - fossa_webhooks
                    - webhooks

    mcp-manager:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: mcp-manager
        image: ghcr.io/brittytino/fossa-mcp-manager:${FOSSA_VERSION:-latest}
        container_name: fossa_mcp_manager_prod
        restart: unless-stopped
        profiles:
            - mcp
            - extras
        command: node dist/apps/mcp-manager/main.js
        env_file:
            - path: ${ENV_FILE:-.env.prod}
              required: false
            - path: .env
              required: false
        environment:
            - API_CLOUD_MODE=false
            - COMPONENT_TYPE=mcp-manager
        ports:
            - '${API_MCP_MANAGER_PORT:-3101}:3101'
        depends_on:
            db_postgres:
                condition: service_healthy
        networks:
            - fossa-backend-services

    #----------------------------------------------------------------
    # Web Frontend
    #----------------------------------------------------------------
    web:
        build:
            context: .
            dockerfile: docker/Dockerfile.web
        image: ghcr.io/brittytino/fossa-web:${FOSSA_VERSION:-latest}
        container_name: fossa_web_prod
        restart: unless-stopped
        env_file:
            - path: ${ENV_FILE:-.env.prod}
              required: false
            - path: .env
              required: false
        environment:
            - API_CLOUD_MODE=false
            - WEB_NODE_ENV=self-hosted
        ports:
            - '${WEB_PORT:-3000}:3000'
        depends_on:
            - api
        networks:
            - fossa-backend-services

    #----------------------------------------------------------------
    # Databases & Infrastructure
    #----------------------------------------------------------------
    db_postgres:
        image: docker.io/pgvector/pgvector:pg16
        container_name: fossa_postgres_prod
        restart: unless-stopped
        env_file:
            - path: ${ENV_FILE:-.env.prod}
              required: false
            - path: .env
              required: false
        environment:
            POSTGRES_USER: ${API_PG_DB_USERNAME:-fossadev}
            POSTGRES_PASSWORD: ${API_PG_DB_PASSWORD:-123456}
            POSTGRES_DB: ${API_PG_DB_DATABASE:-fossa_db}
        ports:
            - '${API_PG_DB_PORT:-5432}:5432'
        volumes:
            - pgdata_prod:/var/lib/postgresql/data
            - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d
        networks:
            fossa-backend-services:
                aliases:
                    - db_postgres
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 30s

    db_mongodb:
        # Pinned, not floating. MongoDB 8.2.11 verified on Linux kernels 6.x & 7.x
        image: docker.io/mongo:8.2.11
        container_name: fossa_mongodb_prod
        restart: unless-stopped
        env_file:
            - path: ${ENV_FILE:-.env.prod}
              required: false
            - path: .env
              required: false
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${API_MG_DB_USERNAME:-fossadev}
            MONGO_INITDB_ROOT_PASSWORD: ${API_MG_DB_PASSWORD:-123456}
            MONGO_INITDB_DATABASE: ${API_MG_DB_DATABASE:-fossa_db}
        ports:
            - '${API_MG_DB_PORT:-27017}:27017'
        volumes:
            - mongodbdata_prod:/data/db
        networks:
            fossa-backend-services:
                aliases:
                    - db_mongodb
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin | grep -q 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 40s

    rabbitmq:
        build:
            context: ./docker/rabbitMQ
            dockerfile: Dockerfile
        image: ghcr.io/brittytino/fossa-rabbitmq:${FOSSA_VERSION:-latest}
        container_name: fossa_rabbitmq_prod
        hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
        ports:
            - '5672:5672'
            - '15672:15672'
            - '15692:15692'
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-dev}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-devpass}
            - RABBITMQ_HOSTNAME=${RABBITMQ_HOSTNAME:-rabbitmq}
            - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 1000000000 -rabbit heartbeat 60
        volumes:
            - rabbitmqdata_prod:/var/lib/rabbitmq
        restart: unless-stopped
        networks:
            fossa-backend-services:
                aliases:
                    - rabbitmq-local
                    - rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        command: /usr/local/bin/init-definitions.sh

volumes:
    pgdata_prod:
    mongodbdata_prod:
    rabbitmqdata_prod:

networks:
    fossa-backend-services:
        driver: bridge
