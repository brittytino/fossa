name: "CI: Lint, Typecheck & Build"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "libs/**"
      - "packages/**"
      - "scripts/**"
      - "test/**"
      - "jest.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm i -g pnpm@11.9.0

      - name: Cache pnpm store
        uses: actions/cache@v5.0.5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install apps/web dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: false
